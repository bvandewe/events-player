services:
  # http://localhost:8884
  event-player:
    image: event-player
    build:
      context: .
      dockerfile: Dockerfile
    command:
      [
        "sh",
        "-c",
        "pip install debugpy -t /tmp && python /tmp/debugpy --listen 0.0.0.0:5678 -m uvicorn api.app:app --host 0.0.0.0 --port 8080 --reload --reload-delay 2 --timeout-graceful-shutdown 3",
      ]
    ports:
      - 8884:8080
      - 5675:5678
    volumes:
      - ./src:/app/src
      - ./static:/app/static # Mount static for UI updates from ui-builder
    environment:
      PYTHONPATH: /app/src
      api_log_level: INFO
      api_default_generator_gateways: '{"urls": ["http://localhost:8080/events/pub", "http://event-player:8080/events/pub"]}'
      api_tag: "v0.3.1"
      # Authentication configuration
      api_auth_mode: disabled # auto, required, disabled
      api_auth_jwks_url: http://keycloak:8080/realms/events-player/protocol/openid-connect/certs
      api_auth_issuer: http://localhost:8885/realms/events-player
      api_auth_audience: events-player-web
      api_auth_required: "false"
      api_keycloak_url: http://keycloak:8080
      api_keycloak_url_external: http://localhost:8885
      api_keycloak_realm: events-player
      api_keycloak_client_id: events-player-web
      api_keycloak_client_secret: ""
      # api_log_format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
      # api_browser_queue_size: 1000
    depends_on:
      - ui-builder
      - keycloak

  # UI builder with hot reload
  ui-builder:
    image: node:20-alpine
    working_dir: /app
    command: npm run dev
    volumes:
      - .:/app
      - /app/node_modules # Anonymous volume for node_modules
    ports:
      - 1234:1234 # Parcel HMR port
    environment:
      NODE_ENV: development
    entrypoint: >
      sh -c "
      npm install &&
      npm run dev
      "

  # 🔐 Keycloak (Authentication & Authorization)
  # http://localhost:8885 (admin/admin)
  keycloak:
    image: quay.io/keycloak/keycloak:22.0.5
    entrypoint: ["/opt/keycloak/entrypoint-wrapper.sh"]
    command:
      - "start-dev"
      - "--import-realm"
      - "--spi-theme-welcome-theme=keycloak"
      - "--spi-theme-admin-theme=keycloak"
    ports:
      - 8885:8080
    environment:
      # Admin credentials
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Development settings (no external DB, uses H2)
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # Disable HTTPS requirement for admin console (development only!)
      KC_HOSTNAME_URL: http://localhost:8885
      KC_HOSTNAME_ADMIN_URL: http://localhost:8885
      KC_PROXY: "none"
    volumes:
      # Persist H2 database to maintain Keycloak configuration across container restarts
      - keycloak_data:/opt/keycloak/data
      # Import realm configuration on first startup only
      - ./deployments/keycloak/events-player-realm-export.json:/opt/keycloak/data/import/events-player-realm-export.json:ro
      # Mount entrypoint wrapper to auto-configure master realm
      - ./deployments/keycloak/entrypoint-wrapper.sh:/opt/keycloak/entrypoint-wrapper.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e 'GET /health/ready HTTP/1.1\r\nhost: http://localhost\r\nConnection: close\r\n\r\n' >&3;if [ $? -eq 0 ]; then echo 'Healthcheck Successful';exit 0;else echo 'Healthcheck Failed';exit 1;fi;",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  keycloak_data:
