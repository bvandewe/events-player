name: mozart-dev
services:
  # http://localhost:8884
  event-player:
    image: event-player
    build:
      context: .
      dockerfile: Dockerfile
    command:
      [
        "sh",
        "-c",
        "pip install debugpy -t /tmp && python /tmp/debugpy --listen 0.0.0.0:5678 -m uvicorn api.app:app --host 0.0.0.0 --port 8080 --reload --reload-delay 2 --timeout-graceful-shutdown 3",
      ]
    ports:
      - 8884:8080
      - 5675:5678
    volumes:
      - ./src:/app/src
    environment:
      PYTHONPATH: /app/src
      api_log_level: DEBUG
      api_default_generator_gateways: '{"urls": ["http://localhost:8884/events/pub", "http://host.docker.internal:8884/events/pub", "http://event-player/events/pub"]}'
      api_tag: "0.2.0"
      # api_log_format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
      # api_browser_queue_size: 1000
