[tool.poetry]
name = "cloudevent-player"
version = "0.1.0"
description = "CloudEvent Player API and UI"
authors = ["Bruno van de Werve <bvandewe@cisco.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
aioredis = "2.0.1"
anyio = "3.6.2"
async-timeout = "4.0.2"
autopep8 = "2.0.2"
certifi = ">=2023.7.22"
charset-normalizer = "3.1.0"
click = "8.1.3"
fastapi = ">=0"
h11 = ">=0.16.0"
httpcore = ">0.16.3"
httpx = ">0.23.3"
idna = ">=3.7"
jinja2 = ">=3.1.6"
markupsafe = "2.1.2"
pycodestyle = "2.10.0"
pydantic = ">=1.10.13"
rfc3986 = "1.5.0"
sniffio = "1.3.0"
sse-starlette = "1.3.3"
starlette = ">0.40.0"
tomli = "2.0.1"
typing-extensions = "4.5.0"
urllib3 = ">=1.26.18"
uvicorn = "0.21.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
