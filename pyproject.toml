[tool.poetry]
name = "cloudevent-player"
version = "0.5.0"
description = "CloudEvent Player API and UI"
authors = ["Bruno van de Werve <bvandewe@cisco.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
aioredis = "^2.0.1"
anyio = "^4.0.0"
async-timeout = "^5.0.0"
autopep8 = "^2.0.0"
certifi = ">=2023.7.22"
charset-normalizer = "^3.0.0"
click = "^8.0.0"
fastapi = ">=0.65.2"
h11 = ">=0.16.0"
httpcore = ">0.16.3"
httpx = ">0.23.3"
idna = ">=3.7"
jinja2 = ">=3.1.6"
markupsafe = "^3.0.0"
pycodestyle = "^2.11.0"
pydantic = ">=1.10.13"
pydantic-settings = "^2.0.0"
python-multipart = ">=0.0.18"
rfc3986 = "^2.0.0"
sniffio = "^1.3.0"
sse-starlette = "^3.0.0"
starlette = ">=0.49.1"
tomli = "^2.0.0"
typing-extensions = ">=4.9.0"
urllib3 = ">=1.26.18"
uvicorn = "^0.38.0"
pre-commit = "^4.3.0"
pyjwt = {extras = ["crypto"], version = "^2.10.1"}

[tool.poetry.group.dev.dependencies]
flake8 = "^7.0.0"
pylint = "^4.0.0"
black = "^25.0.0"
pytest = "^8.4.2"
pytest-asyncio = "^1.2.0"
pytest-cov = "^7.0.0"


[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.5.49"
mkdocs-material-extensions = "^1.3.1"
mkdocs-macros-plugin = "^1.3.7"
mkdocs-glightbox = "^0.5.0"
mkdocs-mermaid2-plugin = "^1.1.1"
mkdocs-awesome-pages-plugin = "^2.9.2"
pymdown-extensions = "^10.3.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
