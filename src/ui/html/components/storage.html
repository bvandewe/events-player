<!-- Storage Utilization Section -->
<div class="storage-section mb-3">
    <div class="d-flex align-items-center mb-2 collapse-header" data-bs-toggle="collapse" data-bs-target="#storageCollapse">
        <i class="bi bi-chevron-down me-2" id="storageChevron"></i>
        <h6 class="mb-0">Storage Utilization</h6>
    </div>
    <div class="collapse show" id="storageCollapse">
        <div class="card">
            <div class="card-body">
                <div class="row">
                    <!-- Recent Events Storage -->
                    <div class="col-md-6">
                        <div class="d-flex justify-content-between mb-1">
                            <small class="text-muted">
                                Recent Events (Full Data)
                                <i class="bi bi-info-circle-fill text-primary" 
                                   style="font-size: 0.75rem; cursor: help;"
                                   data-bs-toggle="tooltip" 
                                   data-bs-placement="top"
                                   title="Full CloudEvent objects for viewing details. Limited to 5,000 most recent events."></i>
                            </small>
                            <small class="text-muted">
                                <span id="recentCount">0</span> / <span id="recentMax">5,000</span>
                            </small>
                        </div>
                        <div class="progress" style="height: 20px;">
                            <div id="recentProgress" class="progress-bar" role="progressbar" 
                                 style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                                <span id="recentPercent">0%</span>
                            </div>
                        </div>
                    </div>

                    <!-- Metadata Storage -->
                    <div class="col-md-6">
                        <div class="d-flex justify-content-between mb-1">
                            <small class="text-muted">
                                Metadata (Index)
                                <i class="bi bi-info-circle-fill text-info" 
                                   style="font-size: 0.75rem; cursor: help;"
                                   data-bs-toggle="tooltip" 
                                   data-bs-placement="top"
                                   title="Lightweight event index for charts and analytics. Limited to 100,000 events."></i>
                            </small>
                            <small class="text-muted">
                                <span id="metadataCount">0</span> / <span id="metadataMax">100,000</span>
                            </small>
                        </div>
                        <div class="progress" style="height: 20px;">
                            <div id="metadataProgress" class="progress-bar bg-info" role="progressbar" 
                                 style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                                <span id="metadataPercent">0%</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
