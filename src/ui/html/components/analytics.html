<!-- Top Analytics Section -->
<div class="analytics-section mb-3">
    <div class="d-flex align-items-center mb-2 collapse-header" data-bs-toggle="collapse" data-bs-target="#analyticsCollapse">
        <i class="bi bi-chevron-down me-2" id="analyticsChevron"></i>
        <h6 class="mb-0">Top Analytics</h6>
    </div>
    <div class="collapse show" id="analyticsCollapse">
        <div class="row">
            <!-- Top Sources -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h6 class="mb-0"><i class="bi bi-hdd-stack text-secondary"></i> Top Sources</h6>
                        <button class="btn btn-sm btn-outline-secondary" id="topSourcesEnlargeBtn" data-bs-toggle="tooltip" data-bs-title="View full screen">
                            <i class="bi bi-arrows-fullscreen"></i>
                        </button>
                    </div>
                    <div class="card-body" style="height: 300px; position: relative">
                        <canvas id="topSourcesChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Top Types -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h6 class="mb-0"><i class="bi bi-diagram-3 text-success"></i> Top Event Types</h6>
                        <button class="btn btn-sm btn-outline-secondary" id="topTypesEnlargeBtn" data-bs-toggle="tooltip" data-bs-title="View full screen">
                            <i class="bi bi-arrows-fullscreen"></i>
                        </button>
                    </div>
                    <div class="card-body" style="height: 300px; position: relative">
                        <canvas id="topTypesChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Top Subjects -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h6 class="mb-0"><i class="bi bi-tag text-warning"></i> Top Subjects</h6>
                        <button class="btn btn-sm btn-outline-secondary" id="topSubjectsEnlargeBtn" data-bs-toggle="tooltip" data-bs-title="View full screen">
                            <i class="bi bi-arrows-fullscreen"></i>
                        </button>
                    </div>
                    <div class="card-body" style="height: 300px; position: relative">
                        <canvas id="topSubjectsChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
