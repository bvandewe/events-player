      </a>      
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsExample03" aria-controls="navbarsExample03" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbar">
        <ul class="navbar-nav mx-auto mb-2 mb-sm-0">
          
          <li class="nav-item">
            <a class="nav-link actionLink" data-nav="events">
              <i class="bi bi-list-ul"></i> Events
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link actionLink" data-nav="timeline">
              <i class="bi bi-activity"></i> Timeline
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link actionLink" data-nav="dashboard">
              <i class="bi bi-speedometer2"></i> Metrics

          <li class="nav-item">

        <span class="badge me-3 p-2" id="connectionStatusIndicator" data-bs-toggle="tooltip" data-bs-title="Connection Status" data-bs-placement="bottom"><i class="bi bi-plug-fill text-white"></i></span>

<script>
  // Navigation handler
  document.addEventListener('DOMContentLoaded', () => {
    // Set active nav item based on current page
    const path = window.location.pathname;
    let currentPage = 'events'; // default
    
    if (path.includes('/timeline')) {
      currentPage = 'timeline';
    } else if (path.includes('/dashboard')) {
      currentPage = 'dashboard';
    }
    
    // Add active class to current page nav link
    document.querySelectorAll('[data-nav]').forEach(link => {
      if (link.getAttribute('data-nav') === currentPage) {
        link.classList.add('active');
      }
      
      // Handle navigation clicks
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const page = link.getAttribute('data-nav');
        const targetPath = page === 'events' ? '/' : `/${page}`;
        window.location.href = targetPath;
      });
    });
  });
</script>
