<!-- Global Filters OffCanvas Panel -->
<div class="offcanvas offcanvas-top p-4 shadow-lg" data-bs-scroll="true" data-bs-backdrop="true" data-bs-keyboard="true" tabindex="-1"
    id="filtersPanel" aria-labelledby="filtersPanelLabel">
    <div class="offcanvas-header justify-content-center">
        <h4 class="offcanvas-title text-primary title" id="filtersPanelLabel">
            <i class="bi bi-funnel-fill me-2"></i>Global Filters
        </h4>
        <button type="button" class="btn-close position-absolute end-0 me-3" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
        <div class="container">
            <div class="row g-3 align-items-center">
                <div class="col-md-3">
                    <label for="globalEventTypeFilter" class="form-label">Event Type</label>
                    <select class="form-select" id="globalEventTypeFilter" aria-label="Filter by event type">
                        <option value="">All Types</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="globalEventSourceFilter" class="form-label">Event Source</label>
                    <select class="form-select" id="globalEventSourceFilter" aria-label="Filter by event source">
                        <option value="">All Sources</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="globalEventSubjectFilter" class="form-label">Event Subject</label>
                    <select class="form-select" id="globalEventSubjectFilter" aria-label="Filter by event subject">
                        <option value="">All Subjects</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label for="globalEventTimeRange" class="form-label">Time Range</label>
                    <select class="form-select" id="globalEventTimeRange" aria-label="Filter by time range">
                        <option value="all">All Time</option>
                        <option value="5m">Last 5 Minutes</option>
                        <option value="15m">Last 15 Minutes</option>
                        <option value="30m">Last 30 Minutes</option>
                        <option value="1h">Last Hour</option>
                        <option value="3h">Last 3 Hours</option>
                        <option value="6h">Last 6 Hours</option>
                        <option value="12h">Last 12 Hours</option>
                        <option value="24h">Last 24 Hours</option>
                        <option value="2d">Last 2 Days</option>
                        <option value="7d">Last 7 Days</option>
                        <option value="30d">Last 30 Days</option>
                        <option value="custom">Custom Range...</option>
                    </select>
                </div>
                <div class="col-md-1">
                    <label class="form-label">&nbsp;</label>
                    <button type="button" class="btn btn-outline-secondary w-100" id="globalClearFiltersBtn" title="Clear all filters">
                        <i class="bi bi-x-circle"></i> Clear
                    </button>
                </div>
            </div>
            <!-- Custom Time Range Inputs (Hidden by default) -->
            <div class="row g-3 mt-2 d-none" id="customTimeRangeInputs">
                <div class="col-md-5">
                    <label for="customStartTime" class="form-label">Start Time</label>
                    <input type="datetime-local" class="form-control" id="customStartTime" aria-label="Custom start time">
                </div>
                <div class="col-md-5">
                    <label for="customEndTime" class="form-label">End Time</label>
                    <input type="datetime-local" class="form-control" id="customEndTime" aria-label="Custom end time">
                </div>
                <div class="col-md-2">
                    <label class="form-label">&nbsp;</label>
                    <button type="button" class="btn btn-outline-primary w-100" id="applyCustomTimeRange" title="Apply custom time range">
                        <i class="bi bi-check-circle"></i> Apply
                    </button>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-12">
                    <div class="alert alert-info d-flex align-items-center" role="alert">
                        <i class="bi bi-info-circle-fill me-2"></i>
                        <div>
                            <strong>Global Filters:</strong> These filters apply to all views (Events, Timeline, Metrics) and persist across page reloads. 
                            All SSE events are still stored regardless of active filters.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
