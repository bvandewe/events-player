<!-- OffCanvas -->
<style>
    /* Toggle button active state styling */
    #randomSourceBtn.active,
    #randomTypeBtn.active,
    #randomSubjectBtn.active {
        background-color: var(--bs-primary);
        color: white;
        border-color: var(--bs-primary);
    }

    #randomSourceBtn.active:hover,
    #randomTypeBtn.active:hover,
    #randomSubjectBtn.active:hover {
        background-color: var(--bs-primary-dark, #0056b3);
        border-color: var(--bs-primary-dark, #0056b3);
    }
</style>

<div class="offcanvas offcanvas-bottom p-4 shadow-lg" data-bs-scroll="true" data-bs-backdrop="true" data-bs-keyboard="true" tabindex="-1"
    id="generatorPanel" aria-labelledby="staticBackdropLabel">
    <div class="offcanvas-header justify-content-center">
        <h4 class="offcanvas-title text-primary title" id="generatorPanelLabel">Generate CloudEvents</h4>
        <button type="button" class="btn btn-sm btn-outline-secondary position-absolute start-0 ms-3" 
                id="resetFormBtn" 
                data-bs-toggle="tooltip" 
                data-bs-title="Reset form to default values"
                title="Reset to defaults">
            <i class="bi bi-arrow-counterclockwise"></i> Reset
        </button>
        <button type="button" class="btn btn-sm btn-outline-info position-absolute start-0 ms-5" 
                style="margin-left: 6rem !important;"
                data-bs-toggle="modal" 
                data-bs-target="#operationsHistoryModal"
                data-bs-title="View operations history"
                title="View history">
            <i class="bi bi-clock-history"></i> History
        </button>
        <button type="button" class="btn-close position-absolute end-0 me-3" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">        
        <div>
            <!-- Operation History Selector -->
            <div class="row mb-3">
                <label for="operationHistory" class="col-1 col-form-label text-end">History</label>
                <select class="col-10 form-select" id="operationHistory" aria-label="Select previous operation">
                    <option value="" selected>New Operation</option>
                </select>
            </div>

            <form id="generatorForm">
                <div class="row">
                    <!-- Event Attributes Panel (2/3) -->
                    <div class="col-8">
                        <div class="card">
                            <div class="card-header py-2">
                                <h6 class="mb-0"><i class="bi bi-lightning-fill text-primary"></i> Event Attributes</h6>
                            </div>
                            <div class="card-body">
                                <div class="row mb-3">
                                    <label for="event_gateway" class="col-2 col-form-label text-end small">Gateway</label>
                                    <div class="col-10">
                                        <select class="form-select form-select-sm" id="event_gateway" name="event_gateway" aria-label="Select a gateway">
                                            <option selected>Select a gateway</option>
                                            {% for gateway_url in default_events_gateways.urls %}
                                            <option value="{{ gateway_url }}">{{ gateway_url }}</option>
                                            {% endfor %}
                                            <option value="__custom__">Custom URL...</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="row mb-3 d-none" id="custom_gateway_container">
                                    <label for="custom_gateway_url" class="col-2 col-form-label text-end small">Custom</label>
                                    <div class="col-10">
                                        <input type="url" class="form-control form-control-sm" id="custom_gateway_url" name="custom_gateway_url" 
                                        placeholder="http://your-gateway:8080/events" onkeydown="return event.key !== ' '">
                                    </div>
                                </div>
                                <div class="row mb-3">
                                    <label for="event_source" class="col-2 col-form-label text-end small">Source</label>
                                    <div class="col-10">
                                        <div class="input-group input-group-sm">
                                            <input type="text" class="form-control" id="event_source" name="event_source" 
                                            placeholder="https://dummy.source.com/sys-admin" onkeydown="return event.key !== ' '"
                                            value="{{ default_events_settings.event_source }}">
                                            <button class="btn btn-outline-secondary d-none" type="button" id="randomSourceBtn" 
                                                    data-bs-toggle="tooltip" 
                                                    data-bs-title="Toggle random source for each iteration (when iterations > 1)">
                                                <i class="bi bi-shuffle"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                                <div class="row mb-3">
                                    <label for="event_type" class="col-2 col-form-label text-end small">Type</label>
                                    <div class="col-10">
                                        <div class="input-group input-group-sm">
                                            <input type="text" class="form-control" id="event_type" name="event_type"
                                            placeholder="com.source.dummy.test.requested.v1" onkeydown="return event.key !== ' '"
                                            value="{{ default_events_settings.event_type }}">
                                            <button class="btn btn-outline-secondary d-none" type="button" id="randomTypeBtn" 
                                                    data-bs-toggle="tooltip" 
                                                    data-bs-title="Toggle random type for each iteration (when iterations > 1)">
                                                <i class="bi bi-shuffle"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                                <div class="row mb-3">
                                    <label for="event_subject" class="col-2 col-form-label text-end small">Subject</label>
                                    <div class="col-10">
                                        <div class="input-group input-group-sm">
                                            <input type="text" class="form-control" id="event_subject" name="event_subject" 
                                            placeholder="123" onkeydown="return event.key !== ' '"
                                            value="{{ default_events_settings.event_subject }}">
                                            <button class="btn btn-outline-secondary d-none" type="button" id="randomSubjectBtn" 
                                                    data-bs-toggle="tooltip" 
                                                    data-bs-title="Toggle random subject for each iteration (when iterations > 1)">
                                                <i class="bi bi-shuffle"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                                <div class="row mb-2">
                                    <label for="event_data" class="col-2 col-form-label text-end small">Data</label>
                                    <div class="col-10">
                                        <textarea class="form-control form-control-sm eventData" id="event_data" rows="6" name="event_data">{{ default_events_settings.event_data }}</textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Timing Panel (1/3) -->
                    <div class="col-4">
                        <div class="card">
                            <div class="card-header py-2">
                                <button class="btn btn-sm btn-link text-decoration-none p-0 w-100 text-start" 
                                        type="button" 
                                        data-bs-toggle="collapse" 
                                        data-bs-target="#timingPanelBody" 
                                        aria-expanded="true" 
                                        aria-controls="timingPanelBody">
                                    <h6 class="mb-0 d-flex justify-content-between align-items-center">
                                        <span><i class="bi bi-clock-fill text-info"></i> Timing</span>
                                        <i class="bi bi-chevron-down"></i>
                                    </h6>
                                </button>
                            </div>
                            <div class="collapse show" id="timingPanelBody">
                                <div class="card-body">
                                    <!-- Iterations Control -->
                                    <div class="mb-3">
                                        <label for="eventIterations" class="form-label small">Iterations: <span id="eventIterationsValue">1</span></label>
                                        <input type="range" min="1" max="500" value="1" class="form-range" id="eventIterations" name="iterations">
                                    </div>
                                    
                                    <!-- Delay Control -->
                                    <div class="mb-3">
                                        <label for="eventDelay" class="form-label small">Delay: <span id="eventDelayValue">100</span> ms</label>
                                        <input type="range" min="50" max="2000" value="100" class="form-range" id="eventDelay" name="delay">
                                    </div>
                                    
                                    <hr>
                                    
                                    <!-- Auto-Repeat Control -->
                                    <div class="mb-2">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" id="repeaterEnabled" role="switch">
                                            <label class="form-check-label small fw-bold" for="repeaterEnabled">
                                                <i class="bi bi-arrow-repeat"></i> Auto-Repeat
                                            </label>
                                        </div>
                                    </div>
                                    <div class="d-none" id="repeaterControls">
                                        <select class="form-select form-select-sm mb-2" id="repeaterInterval">
                                            <option value="1000">1 second</option>
                                            <option value="2000">2 seconds</option>
                                            <option value="5000" selected>5 seconds</option>
                                            <option value="10000">10 seconds</option>
                                            <option value="20000">20 seconds</option>
                                            <option value="30000">30 seconds</option>
                                            <option value="60000">1 minute</option>
                                            <option value="120000">2 minutes</option>
                                            <option value="300000">5 minutes</option>
                                            <option value="600000">10 minutes</option>
                                            <option value="1800000">30 minutes</option>
                                            <option value="3600000">1 hour</option>
                                            <option value="7200000">2 hours</option>
                                            <option value="21600000">6 hours</option>
                                            <option value="43200000">12 hours</option>
                                        </select>
                                        <div class="small mb-2">
                                            <div class="text-muted">Next: <span id="repeaterNextExecution">--</span></div>
                                            <div class="text-muted">Runs: <span id="repeaterRunCount">0</span></div>
                                        </div>
                                        <span class="badge bg-secondary w-100" id="repeaterStatus">Inactive</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row mt-3 mb-1">
                    <button type="submit" class="col-6 btn btn-primary mx-auto">Send</button>
                </div>
                <div class="row mb-3">
                    <div class="progress row col-6 mx-auto" id="task-progress-bar-container" role="progressbar" aria-label="Generator task progress" 
                    aria-valuenow="25" aria-valuemin="0" aria-valuemax="100" style="height: 0px">
                        <div class="progress-bar" id="task-progress-bar" style="width: 0%"></div>
                    </div>
                </div>
            </form>

        </div>
    </div>
</div>
