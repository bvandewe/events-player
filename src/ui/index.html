<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.2">
    <title>CloudEvents Player</title>
    <link rel="stylesheet" href="scss/app.scss">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa&family=Roboto">
    <link rel="stylesheet" href="../../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.ico">
</head>
<body data-bs-theme="dark" 
      data-browser_queue_size="{{ browser_queue_size }}"
      data-keycloak-url="{{ keycloak_url }}"
      data-keycloak-realm="{{ keycloak_realm }}"
      data-keycloak-client-id="{{ keycloak_client_id }}"
      data-auth-mode="{{ auth_mode }}">
    {% include "html/nav.html" %}
    {% include "html/main.html" %}
    {% include "html/footer.html" %}
    {% include "html/offcanvas.html" %}
    {% include "html/help.html" %}
    {% include "html/toast.html" %}
    {% include "html/confirm.html" %}
    {% include "html/clearStorageModal.html" %}
    <script type="module" src="js/app.js"></script>
</body>
</html>
