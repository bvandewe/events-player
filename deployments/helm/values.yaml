namespace: cloud-streams
envAcronym: dev

global:
  appLabel: "events"
  appLabelSuffix: "player"
  eventsPlayerVersion: "v0.3.4"
  ingressDomainSuffix: "k.ccie.cisco.com"
  ingressGateway: "istio-system/all-ccie-gateway-auth-mozart"

player:
  app:
    label: "events"
  replicas: 1
  image:
    repository: ghcr.io/bvandewe/events-player
    tag: v0.3.4
  service:
    type: ClusterIP
    port: 8080
  env:
    # Application Settings
    tag: "v0.3.4"
    log_level: "INFO"
    log_format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    
    # Authentication & Authorization
    auth_required: "false"  # Set to "true" to enable authentication
    # auth_jwks_url and auth_issuer are auto-derived from oauth_* settings below
    # Only set these explicitly if using Istio/Service Mesh without OAuth
    auth_audience: "events-player-web"
    auth_algorithm: "RS256"
    
    # Role Mapping Configuration
    auth_role_admin: "manager"    # Role name in JWT that grants admin privileges
    auth_role_operator: "chef"    # Role name in JWT that grants operator privileges
    auth_role_user: "driver"      # Role name in JWT that grants user privileges
    
    # OAuth/OIDC Configuration
    # Simplified: Single URL, realm, and client_id are all you need
    # auth_jwks_url and auth_issuer are automatically derived from these
    oauth_server_url: "http://localhost:8090"  # OAuth server URL accessible from browser
    oauth_server_url_backend: ""  # Optional: Backend URL for server-to-server calls (e.g., Docker internal URL)
                                   # Leave empty to use oauth_server_url (typical for Kubernetes)
                                   # Set for Docker Compose: oauth_server_url_backend: "http://keycloak:8080"
    oauth_legacy_keycloak: "false"  # Set to "true" for Keycloak < v17 (adds /auth prefix)
    oauth_realm: "mario-pizzeria"
    oauth_client_id: "mario-public-app"
    oauth_client_secret: ""
    
    # HTTP Client Configuration
    http_client_timeout: "30.0"
    
    # Default Generator Settings
    default_generator_gateways: '{"urls": ["http://localhost:8080/events/pub","http://events/events/pub","http://mozart-gateway/api/events/pub","http://sessions-gateway/api/events/pub","http://content-gateway/api/events/pub","http://infra-gateway/api/events/pub","http://external-gateway/api/events/pub"]}'
    default_generator_event: '{"event_source": "https://dummy-source.com","event_type":"com.dummy.test.requested.v1","event_subject":"some.concept.key","event_data":{"foo":"bar"}}'
    
    # Frontend Display Configuration
    browser_queue_size: "3000"
    
    # Frontend Storage Configuration (IndexedDB)
    storage_max_recent_events: "5000"
    storage_max_metadata_events: "100000"
