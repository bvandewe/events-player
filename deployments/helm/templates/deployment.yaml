apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        ports:
          - containerPort: {{ .Values.ports.containerPort }}
        env:
          # Application Settings
          - name: tag
            value: "{{ .Values.environment.tag }}"
          - name: log_level
            value: "{{ .Values.environment.log_level }}"
          - name: log_format
            value: "{{ .Values.environment.log_format }}"
          
          # Authentication & Authorization
          - name: auth_required
            value: "{{ .Values.environment.auth_required }}"
          - name: auth_jwks_url
            value: "{{ .Values.environment.auth_jwks_url }}"
          - name: auth_issuer
            value: "{{ .Values.environment.auth_issuer }}"
          - name: auth_audience
            value: "{{ .Values.environment.auth_audience }}"
          - name: auth_algorithm
            value: "{{ .Values.environment.auth_algorithm }}"
          
          # Role Mapping Configuration
          - name: auth_role_admin
            value: "{{ .Values.environment.auth_role_admin }}"
          - name: auth_role_operator
            value: "{{ .Values.environment.auth_role_operator }}"
          - name: auth_role_user
            value: "{{ .Values.environment.auth_role_user }}"
          
          # OAuth/OIDC Configuration
          - name: oauth_server_url
            value: "{{ .Values.environment.oauth_server_url }}"
          - name: oauth_server_url_external
            value: "{{ .Values.environment.oauth_server_url_external }}"
          - name: oauth_realm
            value: "{{ .Values.environment.oauth_realm }}"
          - name: oauth_client_id
            value: "{{ .Values.environment.oauth_client_id }}"
          - name: oauth_client_secret
            value: "{{ .Values.environment.oauth_client_secret }}"
          
          # HTTP Client Configuration
          - name: http_client_timeout
            value: "{{ .Values.environment.http_client_timeout }}"
          
          # Default Generator Settings
          - name: default_generator_gateways
            value: "{{ .Values.environment.default_generator_gateways }}"
          - name: default_generator_event
            value: "{{ .Values.environment.default_generator_event }}"
          
          # Frontend Display Configuration
          - name: browser_queue_size
            value: "{{ .Values.environment.browser_queue_size }}"
          
          # Frontend Storage Configuration
          - name: storage_max_recent_events
            value: "{{ .Values.environment.storage_max_recent_events }}"
          - name: storage_max_metadata_events
            value: "{{ .Values.environment.storage_max_metadata_events }}"
