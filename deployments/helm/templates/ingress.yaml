apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
    name: '{{ .Values.global.appLabel }}-{{ .Values.global.appLabelSuffix }}-to-auth-mozart'
    namespace: istio-system
spec:
    gateways:
        - istio-system/all-ccie-gateway
    hosts:
        - '{{ .Values.global.appLabel }}.{{ .Values.global.ingressDomainSuffix }}'
    http:
        - route:
              - destination:
                    host: istio-ingressgateway-auth-mozart
                    port:
                        number: 80

---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
    name: '{{ .Values.global.appLabel }}-{{ .Values.global.appLabelSuffix }}'
    namespace: '{{ .Values.namespace }}'
spec:
    gateways:
        - '{{ .Values.global.ingressGateway }}'
    hosts:
        - '{{ .Values.global.appLabel }}.{{ .Values.global.ingressDomainSuffix }}'
    http:
        - headers:
              request:
                  set:
                      x-forwarded-port: '443'
                      x-forwarded-proto: https
          route:
              - destination:
                    host: '{{ .Values.global.appLabel }}-{{ .Values.global.appLabelSuffix }}'
                    port:
                        number: {{ .Values.player.service.port }}
